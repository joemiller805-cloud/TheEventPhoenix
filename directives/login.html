<style>
	.alert-danger{ display:none; }
</style>
<h2>Please log in to continue:</h2>
<div class="alert alert-danger" role="alert">Invalid login credentials.  Please try again.</div>
<div class="row">
	<form name="loginform">
		<div class="col-md-8">
			<div class="mb-3">
				<div class="controls">
					<label>Account: </label>
					<div ng-show="accountid">
						<b style="font-size:large">{{getAccountName(accountid)}}</b>
						<a href="#" style="margin-left:2em" ng-click="accountid = null">Log In to a Different Account</a>
					</div>
					<select class="form-select" name="accountid" ng-model="accountid" required
						ng-show="!accountid">
						<option value="">Please select</option>
						<option ng-repeat="account in accounts" value="{{account.id}}">
							{{account.name}}
						</option>
					</select>
				</div>
			</div>
			<div class="mb-3">
				<div class="controls">
					<label>E-mail Address:</label>
					<input type="text" class="form-control" name="email" ng-model="email" required>
				</div>
			</div>
			<div class="mb-3">
				<div class="controls">
					<label>Password:</label>
					<input type="password" class="form-control" name="pass" ng-model="pass" required>
				</div>
			</div>
			<button ng-click="login()" class="btn btn-primary">Login</button>
			<center>
				<a id="resetPwLink" href="/reset_password.php">I forgot my password</a>
			</center>
		</div>
	</form>
</div>
