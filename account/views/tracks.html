<h3>Course Tracks</h3>
<div class="row">
	<div class="col-md-11">
		<div style="text-align:right;margin-bottom:5px">
        	<button class="btn btn-success select" ng-click="addTrack()">
        		New track&nbsp;
        		<span class="badge"><i class="bi bi-plus-circle"></i></span>
        	</button>
        </div>
		<table class="table">
			<tr ng-repeat="track in tracks">
				<td>
					<input class="form-control" ng-model="track.name" ng-change="track.pristine = false"/>
				</td>
				<td>
					<span ng-hide="track.deleteClicked">
						<button class="btn btn-primary" ng-disabled="track.pristine" ng-click="updateTrack(track)">
							Update
						</button>
						<button class="btn btn-primary btn-warning" ng-click="track.deleteClicked=true">
							Delete
						</button>
					</span>
					<span ng-show="track.deleteClicked">
						<button class="btn btn-primary" ng-click="track.deleteClicked = false">
							Cancel
						</button>
						<button class="btn btn-primary btn-warning" ng-click="deleteTrack(track)">
							Confirm Delete
						</button>
					</span>
				</td>
			</tr>
		</table>
	</div>
</div>

<div class="hide">
	<div id="newTrackDialog">
		Track Name
		<input ng-model="newTrack" />
		<div class="button-row" style="margin-top:5px">
			<button class="btn btn-primary" ng-click="cancelNew()">Cancel</button>
			<button class="btn btn-success select" ng-disabled="newTrack == ''" ng-click="saveNewTrack()">
				Add
			</button>
		</div>
	</div>
</div>
