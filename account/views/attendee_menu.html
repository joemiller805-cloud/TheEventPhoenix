<div class="row">
	<div class="col-lg-12" ng-cloak>
		<h3>Attendee Menu</h3>
	</div>
	<table class="table striped scrollable">
		<thead>
			<tr>
				<th>Menu Item</th>
				<th>Label</th>
				<th>Disabled</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="(key, item) in menuItems">
				<td>{{key}}</td>
				<td>
					<input class="form-control" type="text" ng-model="item.label" style="width:20em" />
				</td>
				<td>
					<input class="form-check-input" type="checkbox" ng-model="item.disabled" 
						ng-if="allowDisable(key)"/>
				</td>
			</tr>
		</tbody>
	</table>
	<div class="button-row">
		<button class="btn btn-success" ng-click="saveSettings()">Save</button>
	</div> 
</div>
