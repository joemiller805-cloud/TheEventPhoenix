<div class="col-md-11">
	<H3>Expense Payment Methods</H3>
	<div style="text-align:right;margin-bottom:1em">
		<button class='btn btn-success' ng-click="newMethod()" style="margin-left:2em">
			<i class="bi bi-plus-circle"></i>
			New Payment Method &nbsp;
		</button>
	</div>
	<table class="table scrollable striped">
		<thead>
			<tr>
				<th>Method</th>
				<th>&nbsp;</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="method in methods track by $index">
				<td><input type="text" class="form-control" ng-model="methods[$index]"/></td>
				<td>
					<button class='btn btn-danger' ng-click="removeMethod($index)">
						<i class="bi bi-trash"></i>
					</button>
				</td>
			</tr>
		</tbody>
	</table>
	<div class="button-row" ng-show="methods.length">
		<button class="btn btn-success" ng-click="save()">Save Changes</button>
	</div>
</div> <!-- End Column -->
