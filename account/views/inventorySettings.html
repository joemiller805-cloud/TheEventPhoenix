<div class="row">
<div class="col-md-11">
	<H4>
		Locations
		<button class="btn btn-primary btn-sm right" ng-click="addLocation()">
			<i class="bi bi-plus-circle"></i> Add Location
		</button>
	</H4>
	<div style="columns:4;margin-top:3px;margin-left:2em">
		<div ng-repeat="location in locations track by $index" class='quarterDiv'>
			<input type="text" ng-model="locations[$index]" class="form-control" placeholder="Location" />
			<button ng-click="dleteLocation($index)"class="btn btn-danger btn-xs" 
				title="Delete {{locations[$index]}}">
				<span class="bi bi-trash"></span>
			</button>
		</div>
	</div>
	<hr/><br/>

	<H4>
		Conditions
		<button class="btn btn-primary btn-sm right" ng-click="addCondition()">
			<i class="bi bi-plus-circle"></i> Add Condition
		</button>
	</H4>
	<div style="columns:4;margin-top:3px;margin-left:2em">
		<div ng-repeat="condition in conditions track by $index" class='quarterDiv'>
			<input type="text" ng-model="conditions[$index]" class="form-control" placeholder="Condition" />
			<button ng-click="dleteCondition($index)"class="btn btn-danger btn-xs" 
				title="Delete {{conditions[$index]}}">
				<span class="bi bi-trash"></span>
			</button>
		</div>
	</div>
	<hr/><br/>

	<H4>
		Categories
		<button class="btn btn-primary btn-sm right" ng-click="addCategory()">
			<i class="bi bi-plus-circle"></i> Add Category
		</button>
	</H4>
	
	<!-- Categories -->
	<div ng-repeat="cat in categories" class="categoryDiv">
		<input type="text" ng-model="cat.name" class="form-control catInput" placeholder="Category Name" />
		<button ng-click="dleteCat($index)"class="btn btn-danger btn-sm" title="Delete {{cat.name}}">
			<span class="bi bi-trash"></span>
		</button>
		
		<button class="btn btn-primary btn-sm right" ng-click="addType(cat)">Add Type</button>

		<!-- Types -->
		<div style="columns:4;margin-top:1em;margin-left:2em">
			<div ng-repeat="type in cat.types track by $index" class='quarterDiv'>
				<input type="text" ng-model="cat.types[$index]" class="form-control" 
					placeholder="Type Name" />
				<button ng-click="dleteType(cat, $index)"class="btn btn-danger btn-xs" 
					title="Delete {{cat.types[$index]}}">
					<span class="bi bi-trash"></span>
				</button>
			</div>
		</div>

		<div style="margin-left:2em;margin-top:1em">
			<b style="margin-right:2em">Track</b>
			<label><input type="checkbox" ng-model="cat.brand" /> Brand</label> 
			<label><input type="checkbox" ng-model="cat.model" /> Model</label> 
			<label><input type="checkbox" ng-model="cat.serial_number" /> Serial Number</label> 
			<label><input type="checkbox" ng-model="cat.notes" /> Notes</label> 
			<label><input type="checkbox" ng-model="cat.item_condition" /> Condition</label> 
			<label><input type="checkbox" ng-model="cat.purchase_date" /> Purchase Date</label> 
			<label><input type="checkbox" ng-model="cat.purchase_price" /> Purchase Price</label> 
			<label><input type="checkbox" ng-model="cat.location" /> Location</label> 
		</div>
	</div>
	<div class="button-row" style="margin-top:1em">
		<button class="btn btn-success" ng-click="save()">
			<span class="bi bi-floppy"></span> Save
		</button>
	</div>
</div> <!-- End col-md-10 -->
</div> <!-- End .row -->

<style>
	button.right{ 
		float:right;
		margin-bottom: .5em;
	}
	.catInput{
		font-weight:bold;
		border: 1px solid black;
	}
	.categoryDiv{
		margin-top:1em;
		border-bottom: 1px solid silver;
		padding-bottom:1em;
	}
	.categoryDiv label{
		font-weight: normal;
		margin-right: 1em;
	}
	.quarterDiv{ margin-bottom:2px; }
	div.quarterDiv .form-control{
		display: inline-block;
		width:85%;
	}
	.categoryDiv .form-control{
		display: inline-block;
		width:85%;
	}
	H4{
		color: white;
	    background: var(--header);
	    padding: 5px 10px;
	}
	H4 .btn{
		padding:1px 6px;
		background:#0c518d;
		margin-left:2em;
	}
</style>
