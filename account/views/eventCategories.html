<div class="col-md-11">
	<H3>Event Categories</H3>
	<div style="text-align:right;margin-bottom:1em">
		<button class='btn btn-success' ng-click="addCat()" style="margin-left:2em">
			<i class="bi bi-plus-circle"></i>
			New Event Category 
		</button>
	</div>
	<table class="table scrollable striped">
		<thead>
			<tr>
				<th>Category Name</th>
				<th style="width:3em"></th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="cat in categories track by $index">
				<td>
					<input type="text" ng-model="categories[$index]" maxlength="40" class="form-control" style="width:50em">
				</td>
				<td>
					<button class="btn btn-sm btn-primary" ng-click="removeCat(cat)">
						<span class="bi bi-trash"></span>
					</button>
				</td>
			</tr>
		</tbody>
	</table>
	<div class="button-row">
		<button class="btn btn-primary" ng-click="saveSettings()">Save Categories</button>
	</div>
</div> <!-- End Column -->
