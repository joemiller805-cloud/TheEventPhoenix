<style>
	 div .form-control{ display:inline-block; }
</style>
<sched-mgmt-tabs></sched-mgmt-tabs>
<div class="col-md-11">
	<h2 style="display:inline-block;width:20em">Event Course Catalog</h2>
	<span style="display:inline-block;width:20em">
		<input ng-model="quickSearch" class="form-control"
			placeholder="Quick Search" />
	</span>
	<span style="display:inline-block;width:20em;margin-bottom:1em;">
		<select ng-model="statusFilter" class="form-select">
			<option value="all">All Courses</option>
			<option value="selected">Presented at this Event</option>
			<option value="notSelected">Not Presented at this Event</option>
			<option value="listed">Included on Attendee Courses Page</option>
		</select>
	</span>
	<table class="table scrollable striped">
		<thead>
			<tr class="headerRow sticky noPad">
				<th>Course</th>
				<th>
					Presented at Event<br/>
					<label>
						<input type="checkbox" ng-model="selectAll" class="form-check-input"
							style="display:inline-block" ng-change="selectAllChg()" />
						Set All
					</label>
				</th>
				<th>
					Include on Attendee Courses Offered Page<br/>
					<label>
						<input type="checkbox" ng-model="listAll" class="form-check-input"
							style="display:inline-block" ng-change="listAllChg()" />
						Set All
					</label>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="course in courses | orderObjectBy:'name'"
				ng-if="showCourse(course)">
				<td>{{course.name}}</td>
				<td>
					<input class="form-check-input" type="checkbox" 
						ng-model="course.selected" ng-change="selectedChg(course)"/>
				</td>		
				<td>
					<input class="form-check-input" ng-model="course.include_course_list" 
						type="checkbox"  ng-disabled="!course.selected"/>
				</td>		
			</tr>
		</tbody>
	</table>

	<div class="button-row" style="margin-top:1em">
		<p ng-show="saveSuccess" class='alert alert-success' style="display:inline-block">
			Changes saved
		</p>
		<button ng-click="saveChanges()" class="btn btn-primary">Save</button><br/>
	</div>	
</div> <!-- End Column -->
