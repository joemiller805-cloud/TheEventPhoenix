<style>
	div#content {
		overflow:scroll; min-height:300px; max-height:500px;
	}
	div#wysiwyg-buttons i.bi {
		font-size:0.75em;
		line-height:0.75em;
	} 
</style>

<div class="col-md-9">
	<h2>Edit Page</h2>
	<form class="form-horizontal" role="form">
		<div class="mb-2 row">
			<label class="col-2 col-form-label" for="name">Page Name:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control" placeholder="Page Name"
					ng-model="page.name" ng-keyup="nameChange()">
			</div>
		</div>

		<div class="mb-2 row">
			<label class="col-2 col-form-label" for="slug">Page Slug:</label>
			<div class="col-sm-10">
				<input type="text" name="slug" class="form-control" placeholder="Page Slug"
					ng-model="page.slug">
			</div>
		</div>

		<div class="mb-2 row">
			<label class="col-2 col-form-label">Event home?</label>
			<div class="col-sm-10">
				<input type="checkbox" class="form-check-input"
					ng-model="page.home" ng-true-value="'1'" ng-false-value="'0'" />
			</div>
		</div>

		<div class="mb-2 row">
			<label class="col-2 col-form-label">Show for registrants only?</label>
			<div class="col-sm-10">
				<input type="checkbox" class="form-check-input" ng-model="page.show_registrants"
					ng-true-value="'1'" ng-false-value="'0'" />
			</div>
		</div>
		<div class="mb-2 row">
			<label class="col-2 col-form-label" for="content">Content:</label>
			<div class="col-sm-10">
				<div class="panel">
					<textarea name="content" id="content_text" style="width: 100%; min-height: 300px; max-height: 500px">{{page.content}}</textarea>
				</div>
			</div>
		</div>
		<div class="form-group button-row">
			<div class="col-sm-2"></div>
			<div class="col-sm-10">
				<span ng-show="!deleteClicked">
					<button class="btn btn-primary" ng-click="savePage()" ng-disabled="!page.name">
						Save
					</button>
					<a ng-click="goBack()">
						<button type="button" class="btn btn-primary">Cancel</button>
					</a>
					<button type="button" class="btn btn-warning"
						ng-show="page.id" 
						ng-click="deleteClicked = true">
						Delete
					</button>
				</span>

				<span ng-show="deleteClicked">
					Are you sure you want to delete this page?
					<button type="button" class="btn btn-danger" ng-click="deletePage()">
						Confirm Delete
					</button>
					<button type="button" class="btn btn-success" ng-click="deleteClicked = fasle">
						Nevermind
					</button>
				</span>
			</div>
		</div>
	</form>
</div>
