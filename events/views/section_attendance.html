<sched-mgmt-tabs ng-show="acctType == 'event'"></sched-mgmt-tabs>
<div class="col-md-11">
	<div class="row" style="margin-bottom:1em">
		<div class="center" style="margin-bottom:5px">
			<input type="text" ng-model="searchVal" placeholder="Search" class="form-control" 
				style="display:inline-block;width:20em" ng-change="searchSessions()"/>
		</div>
		<table id="sessionTable" class="table scrollable striped" data-width="98%">
			<thead>
				<tr class="pointer">
					<th ng-click="changeSort('course')"><sort-arrows></sort-arrows>Course</th>
					<th ng-click="changeSort('session')"><sort-arrows></sort-arrows>Session</th>
					<th ng-click="changeSort('room')"><sort-arrows></sort-arrows>Room</th>
					<th ng-click="changeSort('starttime')" data-sort-type="date"> <sort-arrows></sort-arrows>Date</th>
					<th ng-click="changeSort('capacityRm')" data-sort-type="integer"><sort-arrows></sort-arrows> Capacity</th>
					<th ng-click="changeSort('signupcount')" data-sort-type="integer"> <sort-arrows></sort-arrows> Signups</th>
					<th ng-click="changeSort('attendance')" data-sort-type="integer"> <sort-arrows></sort-arrows> Attendance</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="session in sessions | orderBy:sortField:sortDesc" ng-if="session.show">
					<td>{{session.course}}</td>
					<td>{{session.session}}</td>
					<td>{{session.room}}</td>
					<td>{{session.starttime | mySqlToLocalDate}}</td>
					<td>{{session.capacityRm}}</td>
					<td>{{session.signupcount}}</td>
					<td>
						<input type="number" string-to-number ng-model="session.attendance" style="width:6em"
							ng-blur="updateAttendance(session)"/>
						<span style="color:green;display:inline-block;width:2em;">
							<em ng-show="session.updated">&#10004;</em>
						</span>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
